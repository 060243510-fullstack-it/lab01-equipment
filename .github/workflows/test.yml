# GitHub จะรัน npm test ให้ทุกครั้งที่ push แล้วขึ้นเครื่องหมายถูกหรือกากบาทข้าง commit
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
